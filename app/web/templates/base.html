<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OLRE{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
</head>
<body class="{% block body_class %}app-shell{% endblock %}">
    <div class="page-backdrop"></div>

    <header class="topbar">
        <div class="shell shell-wide topbar-inner">
            <a href="/" class="brandmark" aria-label="OLRE Home">
                <span class="brandmark-icon">
                    <span></span>
                </span>
                <span class="brandmark-copy">
                    <strong>OLRE</strong>
                    <small>Official Letter Reference Extractor</small>
                </span>
            </a>

            <nav class="main-nav" aria-label="Primary">
                <a href="/" class="nav-link {% if request.url.path == '/' %}is-active{% endif %}">Home</a>
                <span class="nav-link is-placeholder">Batch Processing</span>
                <span class="nav-link is-placeholder">Results</span>
                <span class="nav-link is-placeholder">Exports</span>
            </nav>

            <div class="topbar-actions">
                {% block topbar_actions %}
                {% if user %}
                <div class="user-pill">
                    <span class="user-pill-label">Signed in</span>
                    <strong>{{ user.display_name }}</strong>
                </div>
                <form method="post" action="/logout">
                    <button type="submit" class="button button-primary">Sign out</button>
                </form>
                {% else %}
                <a href="/login" class="button button-primary">Secure Login</a>
                {% endif %}
                {% endblock %}
            </div>
        </div>
    </header>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
