<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OLRE{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
</head>
<body class="{% block body_class %}app-shell{% endblock %}">
    <div class="page-backdrop"></div>

    <header class="topbar">
        <div class="shell shell-wide topbar-inner">
            <a href="/" class="brandmark" aria-label="OLRE Home">
                <span class="brandmark-icon">
                    <span></span>
                </span>
                <span class="brandmark-copy">
                    <strong>OLRE</strong>
                    <small>Official Letter Reference Extractor</small>
                </span>
            </a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="/" class="nav-link {% if current_page == 'home' %}is-active{% endif %}">หน้าหลัก</a>
                <a href="/imports" class="nav-link {% if current_page == 'imports' %}is-active{% endif %}">นำเข้าไฟล์</a>
                <a href="/batch" class="nav-link {% if current_page == 'batch' %}is-active{% endif %}">ประมวลผลชุดงาน</a>
                <a href="/batch/runs" class="nav-link {% if current_page == 'batch_runs' %}is-active{% endif %}">Batch Runs</a>
                <a href="/results" class="nav-link {% if current_page == 'results' %}is-active{% endif %}">ผลการตรวจสอบ</a>
                <a href="/exports" class="nav-link {% if current_page == 'exports' %}is-active{% endif %}">ส่งออกข้อมูล</a>
            </nav>

            <div class="topbar-actions">
                {% block topbar_actions %}
                {% if user %}
                <div class="user-pill">
                    <span class="user-pill-label">เข้าสู่ระบบแล้ว</span>
                    <strong>{{ user.display_name }}</strong>
                </div>
                <form method="post" action="/logout">
                    <button type="submit" class="button button-primary">ออกจากระบบ</button>
                </form>
                {% else %}
                <a href="/login" class="button button-primary">เข้าสู่ระบบ</a>
                {% endif %}
                {% endblock %}
            </div>
        </div>
    </header>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
