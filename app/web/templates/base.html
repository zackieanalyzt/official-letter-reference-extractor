<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OLRE{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
</head>
<body class="{% block body_class %}app-shell{% endblock %}">
    <div class="page-backdrop"></div>

    <header class="topbar">
        <div class="shell shell-wide topbar-inner">
            <a href="/" class="brandmark" aria-label="OLRE {{ labels.home }}">
                <span class="brandmark-icon">
                    <span></span>
                </span>
                <span class="brandmark-copy">
                    <strong>OLRE</strong>
                    <small>{{ labels.app_full_name }}</small>
                </span>
            </a>

            <nav class="main-nav" aria-label="{{ labels.app_full_name }}">
                <a href="/dashboard" class="nav-link {% if current_page == 'dashboard' %}is-active{% endif %}">{{ labels.dashboard }}</a>
                <a href="/ops/traversal" class="nav-link {% if current_page == 'ops_traversal' %}is-active{% endif %}">{{ labels.traversal_ops }}</a>
                <a href="/results" class="nav-link {% if current_page == 'results' %}is-active{% endif %}">{{ labels.results }}</a>
                <a href="/quality" class="nav-link {% if current_page == 'quality' %}is-active{% endif %}">{{ labels.quality }}</a>
                <a href="/exports" class="nav-link {% if current_page == 'exports' %}is-active{% endif %}">{{ labels.exports }}</a>
                <a href="/batch" class="nav-link {% if current_page == 'batch' %}is-active{% endif %}">{{ labels.batch }}</a>
                <a href="/imports" class="nav-link {% if current_page == 'imports' %}is-active{% endif %}">{{ labels.imports }}</a>
            </nav>

            <div class="topbar-actions">
                <div class="language-switcher" aria-label="{{ labels.language }}">
                    <span>{{ labels.language }}:</span>
                    <form method="post" action="/settings/language" class="language-form">
                        <input type="hidden" name="lang" value="th">
                        <input type="hidden" name="next" value="{{ request.url.path }}">
                        <button type="submit" class="language-option {% if current_lang == 'th' %}is-active{% endif %}">{{ labels.thai }}</button>
                    </form>
                    <form method="post" action="/settings/language" class="language-form">
                        <input type="hidden" name="lang" value="en">
                        <input type="hidden" name="next" value="{{ request.url.path }}">
                        <button type="submit" class="language-option {% if current_lang == 'en' %}is-active{% endif %}">{{ labels.english }}</button>
                    </form>
                </div>
                {% block topbar_actions %}
                {% endblock %}
            </div>
        </div>
    </header>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
