[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "official-letter-reference-extractor"
version = "0.1.0"
description = "Official Letter Reference Extractor (OLRE) bootstrap project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "itsdangerous>=2.2,<3.0",
    "jinja2>=3.1,<4.0",
    "numpy>=1.26,<3.0",
    "opencv-python>=4.10,<5.0",
    "pymupdf>=1.24,<2.0",
    "pydantic-settings>=2.3,<3.0",
    "pydantic>=2.7,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "pymysql>=1.1,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
